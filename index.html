<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo OS Web Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-window">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">TurboOS v0.1 - TTY1</span>
        </div>
        <div id="terminal-body" class="terminal-body">
            <div class="output">Welcome to Turbo OS Web Emulator. Type 'help' for commands.</div>
        </div>
        <div class="terminal-input-line">
            <span class="prompt">turbo@os:~$ </span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
