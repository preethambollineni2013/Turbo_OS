<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turbo OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Windows get added here by script.js -->
  <div id="desktop">
    <!-- Desktop icons (click to open) -->
    <div id="icons">
      <div class="icon" onclick="openApp('clock')"><span>&#128339;</span>Clock</div>
      <div class="icon" onclick="openApp('calculator')"><span>&#129518;</span>Calculator</div>
      <div class="icon" onclick="openApp('terminal')"><span>&#128187;</span>Terminal</div>
      <div class="icon" onclick="openApp('browser')"><span>&#127760;</span>Browser</div>
      <div class="icon" onclick="openApp('about')"><span>&#128100;</span>About Me</div>
    </div>
  </div>

  <!-- Start menu (hidden until Turbo is clicked) -->
  <div id="menu" class="hidden">
    <div onclick="openApp('clock')">Clock &amp; Calendar</div>
    <div onclick="openApp('calculator')">Calculator</div>
    <div onclick="openApp('terminal')">Terminal</div>
    <div onclick="openApp('browser')">Browser</div>
    <div onclick="openApp('about')">About Me</div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="turbo-btn">Turbo</button>
    <div id="tasks"></div>
    <div id="datetime"></div>
  </div>

  <script src="script.js"></script>
</body>
                              </html>
