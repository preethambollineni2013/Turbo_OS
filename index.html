<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot"><h1>TURBO OS</h1><div class="pb"><i id="bar"></i></div><p id="bmsg">Starting...</p></div>

<div id="topclock"><span id="t1"></span><small id="t2"></small></div>
<div id="desktop"><div id="icons"></div></div>

<div id="menu">
  <div class="head">Turbo OS</div>
  <div id="mitems"></div>
  <hr>
  <div class="item" onclick="reboot()">Reboot</div>
</div>
<div id="taskbar">
  <button class="btn" id="turbo">Turbo</button>
  <div id="tasks"></div>
</div>

<script src="script.js"></script>
</body>
</html>
